/**:
  ros__parameters:
    control_period: 0.01 #[s]
    buffer_size: 10

    horizon_times: [2.0, 3.0, 4.0] #[s]
    planned_speed: [2.0, 0.0] # linear_velocity[m/s], angular_velocity[rad/s]
    stop_sign_class_id: 5
    go_sign_class_id: 6
    decel_bbox_width_start: 15.0
    stop_bbox_width_threshold: 45.0
    min_velocity_scale: 0.2
    curvature_gain: 1.0
    benefit_gain: 3.0
    
    velocity_control:
      deceleration_angle_maximum: 0.267  # R=15m, v=2.0m/s, horizon[0]=2.0sで計算
      deceleration_gain: 0.5

    prediction:
      integration_dt: 0.01
      velocity_response_time: 0.0  # 速度追従時定数 (0.0で即時追従)
      yaw_rate_response_time: 0.0  # 旋回角速度追従時定数 (0.0で即時追従)

    # Note: トルク制御（動力学モデル）用のパラメータ（速度指令制御では不要）
