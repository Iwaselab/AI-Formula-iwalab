/**:
  ros__parameters:
    control_period: 0.02 # [s] (50 Hz)
    buffer_size: 10

    planned_speed: [2.5, 0.0] # linear_velocity[m/s], angular_velocity[rad/s]
    yaw_rate_gain: 1.0

    # Traffic sign stop/go parameters
    stop_sign_class_id: 5
    go_sign_class_id: 6
    decel_bbox_width_start: 15.0
    stop_bbox_width_threshold: 45.0
    min_velocity_scale: 0.2

    # Curvature-based deceleration
    velocity_control:
      eval_dt: 0.5 # [s]
      deceleration_angle_maximum: 0.267
      deceleration_gain: 0.5

    # Lane fitting (stateless least-squares, no extrapolation)
    lane:
      max_point_length: 50.0 # [m]
      width: 3.5 # [m] 片側欠損時の補完用車線幅
      min_points_for_quadratic: 6
      min_x_range_for_quadratic: 4.0 # [m]

    # Sampling-based MPC
    sampling:
      curvature_limit: 0.15 # [rad/m] (R_min = 6.67 m 相当)
      num_candidates: 41 # 奇数を指定（中央に 0.0 を含む）
      horizon_min_distance: 1.5 # [m]
      horizon_max_distance: 8.0 # [m]
      num_horizon_points: 8
      min_valid_points: 3
      center_weight: 1.0
      boundary_weight: 10.0
      road_margin: 0.3 # [m] 白線からの安全余裕
      smoothness_weight: 0.05 # 前回曲率との差の重み（小さめから調整）
